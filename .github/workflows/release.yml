name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundle: nsis
            ext: exe
          - os: macos-15
            bundle: dmg
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - run: npm ci
      - run: python scripts/engine.py
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-${{ runner.os }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.ext }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" installers/*.exe installers/*.dmg --repo "$GITHUB_REPOSITORY" --verify-tag --title "Mosaic $GITHUB_REF_NAME" --notes "Windows x64 (Intel Arc) und macOS arm64 (Apple Silicon)."
        env:
          GH_TOKEN: ${{ github.token }}
